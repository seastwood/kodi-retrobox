# The RetroArch settings this console deliberately sets. install.sh merges
# these into retroarch.cfg, leaving every other setting alone.
#
# Paths use ~ because RetroArch expands it itself, so nothing here is tied to a
# particular user. There are no credentials in this file and there never should
# be: achievements are switched on, but the account is yours to add.

# Where everything lives. This layout is not RetroArch's default; the scripts
# and the Kodi add-on both expect it.
libretro_directory = "~/.local/lib/retroarch/cores/"
playlist_directory = "~/.local/share/retroarch/plists"
system_directory = "~/.local/share/retroarch/system"
thumbnails_directory = "~/.local/share/retroarch/thumbnails"
video_shader_dir = "~/.local/share/retroarch/shaders"
savefile_directory = "~/.config/retroarch/saves"
savestate_directory = "~/.config/retroarch/states"
content_history_path = "~/.local/state/retroarch/plists/content_history.lpl"
joypad_autoconfig_dir = "~/.config/retroarch/autoconfig"

# Drivers known to work on this hardware. ra_guard.py repairs these if a bad
# exit ever writes something that cannot start: video sdl2 in particular
# segfaults on some GPUs, and a null input driver locks you out entirely.
video_driver = "gl"
audio_driver = "pulse"
input_driver = "x"
input_joypad_driver = "udev"
menu_driver = "ozone"

# Leaving a game with a controller. 7 is hold-Start, 8 is hold-Select; the two
# second hold is RetroArch's own HOLD_BTN_DELAY_SEC. quit_press_twice is off
# because the hold is itself the confirmation, and ra_players.py draws a
# progress bar over the game while it runs.
input_quit_gamepad_combo = "7"
input_menu_toggle_gamepad_combo = "8"
quit_press_twice = "false"

# Pick up exactly where you left off. Hold-Start quits rather than suspends, so
# these are what make that feel like putting a console to sleep.
savestate_auto_save = "true"
savestate_auto_load = "true"

# The launcher chooses a CRT filter per system and passes it with --set-shader,
# so this only has to be switched on.
video_shader_enable = "true"

# Lets the launcher talk to a running RetroArch (retroarch --command ...).
network_cmd_enable = "true"

# Achievements. Add your own account in RetroArch's own menu, or with
# install/ra_login.sh; nothing here stores a password. Hardcore is off on
# purpose because it disables savestates, which would break resume above.
cheevos_enable = "true"
cheevos_hardcore_mode_enable = "false"
cheevos_badges_enable = "true"
cheevos_unlock_sound_enable = "true"

# A guest should never be asked to choose a core.
config_save_on_exit = "true"
