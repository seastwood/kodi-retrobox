# Lines added to RetroArch's own profile of the same name, if it lacks them.
#
# The 8BitDo Micro in D mode sends its D-pad as the left stick or as a hat,
# depending on a setting held on the pad itself (Minus + Left for stick,
# Minus + Up for D-pad). RetroArch's packaged profile binds the D-pad to the
# stick axes only, so with the pad set to a real D-pad -- the setting Kodi
# needs -- the D-pad did nothing in any game. Bound to the hat as well, both
# settings work.
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
