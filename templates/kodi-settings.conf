# The Kodi settings this console deliberately sets. kodi-setup.sh merges these
# into guisettings.xml one key at a time, leaving everything else alone.
#
#   setting.id = value
#
# Kodi must be closed when this is applied: it holds guisettings.xml open and
# writes the whole file back out from memory when it quits, straight over
# anything changed underneath it.
#
# Anything here is something a controller in somebody's hands made obvious.

# The ".." row at the top of every list. Kodi shows it by default and focuses
# it, so entering CONSOLES and pressing A -- the first thing anybody does --
# takes you straight back out again. With it off, the first real item is
# focused and one press opens it; B still goes back, which is what a
# controller's B is for and what every console does.
filelists.showparentdiritems = false

# "Add games...", "Add videos..." and the rest. These open Kodi's own source
# browser, which is a file dialog: a dead end from a sofa, and reachable by
# one wrong press. Games arrive here by being put in ~/Games/emulation and
# picked up by the sync, so there is nothing for this button to usefully do.
filelists.showaddsourcebuttons = false

# File extensions on the end of every game name. The playlists carry proper
# labels -- "Sonic The Hedgehog (USA, Europe)", not "Sonic The Hedgehog
# (USA, Europe).md" -- and this puts the extension back on.
filelists.showextensions = false
