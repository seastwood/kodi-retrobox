# Skin settings applied by install/kodi-setup.sh, as id|type|value.
#
# Only the ones that stop the skin interrogating whoever is holding the remote
# on first run, plus the background that makes it look like this console
# rather than a media player. Everything else is left at the skin's defaults so
# it stays yours to change.
askeddefaultbackground|bool|true
customdefaultbackground.path|string|@HOME@/.kodi/media/backgrounds/
enable.animatedbackgrounds|bool|false
